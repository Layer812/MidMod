[platformio]
default_envs = cardputer

[env:cardputer]
platform = espressif32 @ 6.12.0
board = esp32-s3-devkitc-1
framework = arduino

; Cardputer has 8 MB flash. MidMod uses a 6 MB application partition so the
; optional Japanese M5GFX font data fits without removing UI functionality.
board_build.partitions = partitions_midmod_8mb.csv

upload_speed = 1500000
upload_port = COM5
monitor_speed = 115200
monitor_port = COM5

build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DUSE_LONG_FILE_NAMES=1
    -DUSE_UTF8_LONG_NAMES=1

lib_deps =
    m5stack/M5Cardputer@1.1.1
    m5stack/M5UnitSynth@1.0.1
    greiman/SdFat@2.3.1
    majicdesigns/MD_MIDIFile@2.6.0
